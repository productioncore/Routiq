# ============================================================
# NGINX Configuration — Ultra-Scale API Gateway
#
# Data plane: OpenResty (LuaJIT) + Rust FFI (librust_ext.so).
# The Lua glue in lua/gateway.lua calls into Rust for the entire hot path.
# See: docs/decisions/0002-lua-ffi-data-plane-over-native-module.md
# ============================================================

worker_processes      auto;
worker_rlimit_nofile  1048576;
# Drain in-flight requests on SIGTERM before worker exit (K8s rolling deploy).
worker_shutdown_timeout 30s;

# Environment variables exported to worker processes (and thus to Rust's
# std::env). NGINX otherwise scrubs the worker environment.
env CONTROL_PLANE_URL;
env REDIS_HOST;
env REDIS_PORT;
env REDIS_PASSWORD;
env REDIS_USERNAME;
env REDIS_TLS;
env GATEWAY_REGION;
env GATEWAY_CONFIG_PATH;
env JWT_SECRET;
# JWT_KEYS: JSON object of kid→secret for zero-downtime key rotation (ADR-0005).
env JWT_KEYS;
env TLS_ENABLED;
env REVOCATION_FAIL_CLOSED;
# AUTH_CACHE_TTL_SECS: max seconds a validated token is cached before revocation
# is re-checked (ADR-0038).
env AUTH_CACHE_TTL_SECS;
env WAF_IP_RATE_LIMIT_RPS;
env GATEWAY_REFUSE_INSECURE_SECRETS;
env CORS_ALLOWED_ORIGINS;
env UPSTREAM_UAM_AUTH;
env UPSTREAM_DEMO_API;
# OTLP exporter env (Grafana Cloud LGTM). Credentials live in gateway-edge/.env.
env OTEL_EXPORTER_OTLP_ENDPOINT;
env OTEL_EXPORTER_OTLP_HEADERS;

    # ── mTLS: client certificate verification (ADR-0067) ─────
    # Content generated at container start from MTLS_CLIENT_* env vars;
    # empty file = feature off. See docker-start.sh.
    include /etc/nginx/client_mtls.conf;

    error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 65535;
    multi_accept       on;
    use                epoll;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    # ── Lua / Rust FFI runtime ────────────────────────────────
    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    # Load the FFI bridge once in the master process (runs ffi.cdef + ffi.load).
    init_by_lua_block {
        require "gateway"
    }

    # Start the Rust background threads in each worker (post-fork).
    init_worker_by_lua_block {
        require("gateway").init()
    }

    # ── Security: Real IP from Load Balancer / Cloudflare ─────
    # Private ranges: Docker bridge, K8s pod network, internal ALB.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;
    # Cloudflare Free CDN: trust CF edges + CF-Connecting-IP (ADR-0064).
    include cloudflare/real-ip.conf;

    # ── Dynamic DNS Resolver for proxy_pass ───────────────────
    # Allows NGINX to dynamically resolve upstream names.
    # 127.0.0.11 = Docker embedded DNS (Compose). For Render/K8s, use public DNS.
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    server_tokens      off;

    keepalive_timeout  15; # Prevent Slowloris exhaustion
    keepalive_requests 10000;

    client_header_timeout     5s; # Prevent slow-read attacks
    client_body_timeout       5s;
    send_timeout              10s;
    reset_timedout_connection on;

    client_max_body_size        10m;
    client_body_buffer_size     128k;
    large_client_header_buffers 4 8k;

    gzip            on;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      application/json text/plain application/javascript;

    # ── WebSocket upgrade support (ADR-0070) ─────────────────────────────
    # Tier locations proxy Connection/Upgrade headers via these vars so
    # ws:// routes work through the gateway (use the "slow" tier for WS).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── Structured JSON access log ────────────────────────────
    # Privacy policy (ADR-0060): NO client IP, NO User-Agent in logs.
    # Each request emits a visually separated 3-line block:
    #   ┌─ >>> REQ <id> ts=...
    #   │  {...single-line JSON...}
    #   └─ <<< END <id> status=<n> rt=<s>
    log_format json_combined escape=json
        '>>> REQ $gateway_request_id ts=$time_iso8601\n'
        '{"req_id":"$gateway_request_id","method":"$request_method","uri":"$uri",'
        '"status":$status,"bytes":$bytes_sent,"rt":$request_time,'
        '"upstream":"$upstream_addr","upstream_rt":"$upstream_response_time","region":"$target_region","tier":"$target_tier"}\n'
        '<<< END $gateway_request_id status=$status rt=$request_time';

    access_log /var/log/nginx/access.log json_combined buffer=64k flush=5s;

    # ── L2 response cache ─────────────────────────────────────
    proxy_cache_path /tmp/nginx_cache
        levels=1:2
        keys_zone=gateway_cache:64m
        max_size=4g
        inactive=60s
        use_temp_path=off;

    # ── Cache policy ──────────────────────────────────────────
    # L2 cache key is method+host+uri+args — it does NOT include identity.
    # Skip cache for authenticated requests so per-user routing/responses are
    # not served from another user's cached entry. Public routes (no auth) still
    # benefit from proxy_cache. See docs/decisions/0017-multi-layer-caching.md
    map $http_authorization $gateway_skip_cache {
        ""      0;
        default 1;
    }

    # Render / HTTPS upstreams: control-plane may set address host:443 (TLS backends).
    map $target_upstream $gateway_upstream_base {
        ~^(.+):443$ https://$1;
        default     http://$target_upstream;
    }
    map $target_upstream $gateway_upstream_host {
        ~^(.+):443$ $1;
        ~^([^:]+):(.+)$ $1;
        default     $target_upstream;
    }

    # ── Upstream selection (gateway-edge/rust-ext/src/load_balancing/) ──
    # Rust picks upstream per request: weighted consistent hash + power-of-two-choices
    # + EWMA latency + circuit breaker. Writes host:port to $target_upstream.

    # ── HTTP server ──────────────────────────────────────────
    server {
        listen 8080 reuseport backlog=65535;
        server_name _;

        set $gateway_request_id "";

        # Redirect all HTTP to HTTPS in production
        # Comment out for local dev (no certs)
        # return 301 https://$host:8443$request_uri;

        include /usr/local/openresty/nginx/conf/gateway-locations.conf;
    }

    # ── HTTPS server — TLS termination ───────────────────────
    server {
        listen 8443 ssl http2 reuseport backlog=65535;
        server_name _;

        set $gateway_request_id "";

        # Certificates — generated by Dockerfile or mounted from secrets manager
        ssl_certificate      /etc/nginx/certs/server.crt;
        ssl_certificate_key  /etc/nginx/certs/server.key;

        # Modern TLS only
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers on;
        ssl_ecdh_curve       secp384r1;

        # Session resumption — reduces TLS handshake cost from ~500µs to ~50µs
        ssl_session_cache    shared:SSL:50m;
        ssl_session_timeout  1d;
        ssl_session_tickets  off;

        # OCSP stapling — avoids client round-trip to CA
        ssl_stapling         on;
        ssl_stapling_verify  on;

        # mTLS — uncomment to require client certificates
        # ssl_client_certificate /etc/nginx/certs/ca.crt;
        # ssl_verify_client      on;

        include /usr/local/openresty/nginx/conf/gateway-locations.conf;
    }
}
