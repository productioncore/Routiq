# ============================================================
# Gateway Locations — included by both HTTP and HTTPS server blocks
# This is where proxy_pass is wired to real upstreams
# ============================================================

# ── Security headers ──────────────────────────────────────────
# Use more_set_headers (ngx_headers_more, bundled with OpenResty), NOT add_header.
# nginx's add_header is dropped in any context that declares its own add_header —
# and `location /` adds X-Cache-Status, which would silently strip ALL of these
# from the main proxied traffic path. more_set_headers runs in the header-filter
# phase, so it applies uniformly to every location and to Lua error responses.
more_set_headers "X-Content-Type-Options: nosniff";
more_set_headers "X-Frame-Options: DENY";
more_set_headers "X-XSS-Protection: 1; mode=block";
more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
more_set_headers "Referrer-Policy: strict-origin-when-cross-origin";
more_set_headers "Permissions-Policy: geolocation=(), microphone=()";
more_set_headers "Content-Security-Policy: default-src 'none'; frame-ancestors 'none'; sandbox;";

# API must not be cached at Cloudflare edge (free CDN).
include cloudflare/cdn-api-nostore.conf;

# ── Dynamic variables ─────────────────────────────────────────
set $target_region   "";
set $target_upstream "";
set $target_tier     "";
set $gateway_user_id "";
set $gateway_home_region "";

# ── NGINX-level path traversal guard (before Lua) ────────────
# Two layers: raw request_uri catches literal ".."; decoded $uri catches
# %2e%2e-style encodings that the raw form would miss.
if ($request_uri ~* "\.\.") {
    return 403 '{"error":"Forbidden","reason":"path traversal"}';
}
if ($uri ~* "\.\.") {
    return 403 '{"error":"Forbidden","reason":"path traversal (encoded)"}';
}

# ── Hot path ──────────────────────────────────────────────────
# Production: uncomment to allow only Cloudflare + private networks (ADR-0064).
# include cloudflare/origin-lockdown.conf;

location / {
    # Rust hot path: WAF → auth → routing → rate limit → load balancing.
    # On success it sets $target_upstream / $target_region / $target_tier and
    # ngx.exec()s into the matching @up_* policy location; otherwise it
    # short-circuits with the appropriate status (401/403/429/503/…).
    access_by_lua_block { require("gateway").access() }

    # Telemetry + slot release for EARLY-EXIT responses only.
    # Admitted requests exec into an @up_* location whose own log_by_lua runs.
    log_by_lua_block    { require("gateway").log() }
}

# ── Timeout-policy proxy locations (ADR-0062) ─────────────────
# Routes pick a tier in config ("fast" | "normal" | "slow", default normal).
# Shared proxy semantics, per-tier timeout budgets. Slow disables buffering
# (streaming-friendly) and caching (long-tail responses).

location @up_fast {
    internal;
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 5s;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;

    # Rewrite backend cookie domain to gateway domain so browser accepts cookies
    proxy_cookie_domain uam-backend-ciqw.onrender.com gateway-edge.onrender.com;

    include /etc/nginx/upstream_mtls.conf;
    proxy_pass         $gateway_upstream_base$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_ssl_server_name on;
    proxy_ssl_name $gateway_upstream_host;
    proxy_set_header   Host              $gateway_upstream_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Region          $target_region;
    proxy_set_header   X-Upstream        $target_upstream;
    proxy_set_header   X-Tier            $target_tier;
    proxy_set_header   X-User-Id         $gateway_user_id;
    proxy_set_header   X-Home-Region     $gateway_home_region;

    # fast: snappy interactive APIs
    proxy_connect_timeout 1s;
    proxy_send_timeout    5s;
    proxy_read_timeout    5s;

    proxy_buffering    on;
    proxy_buffer_size  16k;
    proxy_buffers      8 16k;

    log_by_lua_block { require("gateway").log() }
}

location @up_normal {
    internal;
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 5s;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;

    # Rewrite backend cookie domain to gateway domain so browser accepts cookies
    proxy_cookie_domain uam-backend-ciqw.onrender.com gateway-edge.onrender.com;

    include /etc/nginx/upstream_mtls.conf;
    proxy_pass         $gateway_upstream_base$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_ssl_server_name on;
    proxy_ssl_name $gateway_upstream_host;
    proxy_set_header   Host              $gateway_upstream_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Region          $target_region;
    proxy_set_header   X-Upstream        $target_upstream;
    proxy_set_header   X-Tier            $target_tier;
    proxy_set_header   X-User-Id         $gateway_user_id;
    proxy_set_header   X-Home-Region     $gateway_home_region;

    # normal: previous gateway-wide defaults
    proxy_connect_timeout 3s;
    proxy_send_timeout    30s;
    proxy_read_timeout    60s;

    proxy_buffering    on;
    proxy_buffer_size  16k;
    proxy_buffers      8 16k;

    # L2 response cache only for the default tier (skips authenticated reqs)
    proxy_cache            gateway_cache;
    proxy_cache_key        "$request_method$host$uri$is_args$args";
    proxy_no_cache         $gateway_skip_cache;
    proxy_cache_bypass     $gateway_skip_cache;
    proxy_cache_valid      200 302 30s;
    proxy_cache_valid      404 1s;
    proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_lock       on;
    proxy_cache_lock_timeout 5s;
    add_header             X-Cache-Status $upstream_cache_status always;

    log_by_lua_block { require("gateway").log() }
}

location @up_slow {
    internal;
    resolver 8.8.8.8 1.1.1.1 valid=30s ipv6=off;
    resolver_timeout 5s;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;

    # Rewrite backend cookie domain to gateway domain so browser accepts cookies
    proxy_cookie_domain uam-backend-ciqw.onrender.com gateway-edge.onrender.com;

    include /etc/nginx/upstream_mtls.conf;
    proxy_pass         $gateway_upstream_base$request_uri;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;
    proxy_ssl_server_name on;
    proxy_ssl_name $gateway_upstream_host;
    proxy_set_header   Host              $gateway_upstream_host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   X-Region          $target_region;
    proxy_set_header   X-Upstream        $target_upstream;
    proxy_set_header   X-Tier            $target_tier;
    proxy_set_header   X-User-Id         $gateway_user_id;
    proxy_set_header   X-Home-Region     $gateway_home_region;

    # slow: long-running jobs, LLM/streaming endpoints — no buffering/cache
    proxy_connect_timeout 5s;
    proxy_send_timeout    300s;
    proxy_read_timeout    300s;
    proxy_buffering       off;

    log_by_lua_block { require("gateway").log() }
}


# ── Health check — bypasses auth, rate-limit, proxy ──────────
location = /health {
    access_log off;
    content_by_lua_block { require("gateway").health() }
}
location = /healthz {
    access_log off;
    default_type application/json;
    return 200 '{"status":"healthy","service":"gateway"}';
}

# ── Readiness check — config must be loaded ───────────────────
location = /ready {
    access_log off;
    content_by_lua_block { require("gateway").ready() }
}

# ── Prometheus metrics — internal networks only ───────────────
location = /metrics {
    access_log off;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow 127.0.0.1;
    deny  all;
    content_by_lua_block { require("gateway").metrics() }
}

# ── Block hidden files ────────────────────────────────────────
location ~ /\. {
    deny all;
    return 404;
}
