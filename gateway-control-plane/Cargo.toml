[package]
name        = "control-plane"
version     = "0.4.0"
edition     = "2021"
description = "Ultra-scale API Gateway — Control Plane (GitOps config + telemetry)"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = true

[dependencies]
actix-web   = "4.13.0"
serde       = { version = "1.0.228", features = ["derive"] }
serde_json  = "1.0.149"
log         = "0.4.29"
num_cpus    = "1.17.0"
arc-swap    = "1.6.0"
# HMAC-SHA256 for admin API request signing
hmac        = "0.12.1"
sha2        = "0.10.8"
# Hex encoding for HMAC digest
hex         = "0.4.3"
# Redis — token revocation publisher (ADR-0038, ADR-0039)
redis       = { version = "0.24", features = ["tls-native-tls"] }
# PostgreSQL — control-plane owned state store (config revisions + audit trail).
# The control plane is a management plane: its config/audit data is its OWN
# operational state (ADR-0011), NOT uam-backend's user data. It writes to a
# dedicated, isolated `control_plane` schema only (least-privilege role).
sqlx        = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "tls-native-tls", "time", "json"] }
# OpenTelemetry → Grafana Cloud (LGTM) — OTLP/HTTP traces, metrics, logs.
opentelemetry          = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs"] }
opentelemetry_sdk      = { version = "0.32", default-features = false, features = ["trace", "metrics", "logs", "rt-tokio"] }
# reqwest-blocking-client selects the blocking HTTP client used by the SDK's
# background exporter threads; reqwest-rustls additionally enables the TLS
# backend (reqwest/default-tls) so HTTPS to Grafana Cloud works.
opentelemetry-otlp     = { version = "0.32", default-features = false, features = ["http-proto", "trace", "metrics", "logs", "reqwest-blocking-client", "reqwest-rustls"] }
tracing                = "0.1"
tracing-subscriber     = { version = "0.3", features = ["env-filter", "registry"] }
tracing-log            = { version = "0.2", features = ["log-tracer"] }
tracing-opentelemetry  = "0.33"
# SSE config stream: broadcast fanout to edge nodes + stream adapters.
# (actix-web already runs on tokio; these are the direct-use pieces.)
tokio        = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
opentelemetry-appender-tracing = "0.32"
